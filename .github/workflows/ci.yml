name: camlflow-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ocaml-tests:
    name: OCaml build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: avsm/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.0
          dune-cache: true

      - name: Pin erratique packages to GitHub mirrors
        run: |
          opam pin add --yes --no-action astring https://github.com/dbuenzli/astring.git#v0.8.5
          opam pin add --yes --no-action topkg https://github.com/dbuenzli/topkg.git#v1.1.1
          opam pin add --yes --no-action fmt https://github.com/dbuenzli/fmt.git#v0.11.0
          opam pin add --yes --no-action cmdliner https://github.com/dbuenzli/cmdliner.git#v2.1.0
          opam pin add --yes --no-action uutf https://github.com/dbuenzli/uutf.git#v1.0.4

      - name: Install OCaml dependencies
        run: opam install . --deps-only --with-test --yes

      - name: Run dune test
        run: opam exec -- dune test

  json-rpc-smoke:
    name: JSON-RPC SDK and host smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up OCaml
        uses: avsm/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.0
          dune-cache: true

      - name: Pin erratique packages to GitHub mirrors
        run: |
          opam pin add --yes --no-action astring https://github.com/dbuenzli/astring.git#v0.8.5
          opam pin add --yes --no-action topkg https://github.com/dbuenzli/topkg.git#v1.1.1
          opam pin add --yes --no-action fmt https://github.com/dbuenzli/fmt.git#v0.11.0
          opam pin add --yes --no-action cmdliner https://github.com/dbuenzli/cmdliner.git#v2.1.0
          opam pin add --yes --no-action uutf https://github.com/dbuenzli/uutf.git#v1.0.4

      - name: Install OCaml dependencies
        run: opam install . --deps-only --with-test --yes

      - name: Install SDK dependencies
        working-directory: packages/camlflow-ts-json-rpc-sdk
        run: npm install

      - name: Build CamlFlow binary
        run: opam exec -- dune build

      - name: Run SDK smoke tests
        working-directory: packages/camlflow-ts-json-rpc-sdk
        run: opam exec -- npm test

      - name: Run JSON-RPC host example
        run: opam exec -- node examples/json-rpc-host/host.js

      - name: Run JSON-RPC problem-coach example
        run: opam exec -- node examples/json-rpc-problem-coach/host.js
